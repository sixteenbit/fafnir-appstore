services:
  # Frontend (nginx). This is what you open in the browser and is the main
  # service Runtipi/Traefik route the app domain to. Its bundled nginx config
  # reverse-proxies /api and the status WebSocket to the backend internally,
  # so the backend does not need its own host port.
  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.1.2
    depends_on:
      - backend
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 80

  # Backend API. Internal only — the browser reaches it through the frontend's
  # nginx proxy, so it must keep the service name "backend" (nginx proxies to
  # http://backend:8000). CORS_ORIGINS must list the origin the browser loads
  # the app from: it defaults to the host LAN IP + chosen port, and can be
  # overridden with a public HTTPS URL for internet exposure. NET_RAW is needed
  # for ICMP ping status checks.
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.1.2
    # Login: the backend has NO built-in default password (AUTH_PASSWORD_HASH
    # defaults to "" in code, which fails every login), so we bake in the bcrypt
    # hash for admin/admin. It's written with doubled '$$' so Compose renders it
    # back to the real '$2b$12$...' hash inside the container. To set your own
    # password, replace the hash with your bcrypt hash (each '$' doubled to '$$');
    # generate one with:
    #   htpasswd -bnBC 12 "" 'yourpassword' | tr -d ':\n' | sed 's/\$/\$\$/g'
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SQLITE_PATH=/app/data/homelab.db
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD_HASH=$$2b$$12$$RtMbyw17l4N5UGzeXMNAWuzCaVV.XFBY7ZetWheQhxcBDcxahapkG
      - SCANNER_RANGES=${SCANNER_RANGES:-["192.168.1.0/24"]}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://${INTERNAL_IP}:${APP_PORT}"]}
      - MCP_SERVICE_KEY=${MCP_SERVICE_KEY}
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    cap_add:
      - NET_RAW
    restart: unless-stopped

  # MCP server (optional AI integration). Exposed on host port 8001 so AI
  # clients like Claude Code/Desktop can read and modify your topology.
  mcp:
    image: ghcr.io/pouzor/homelable-mcp:3.1.2
    environment:
      - BACKEND_URL=http://backend:8000
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_SERVICE_KEY=${MCP_SERVICE_KEY}
      - TZ=${TZ}
    ports:
      - "8001:8001"
    depends_on:
      - backend
    restart: unless-stopped

x-runtipi:
  schema_version: 2
  overrides: []
