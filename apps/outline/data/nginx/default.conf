# Preserve the scheme the browser actually used. TLS terminates at Traefik, so
# the connection into this container is plain HTTP and $scheme is "http".
# Forwarding that would clobber Traefik's "X-Forwarded-Proto: https", and
# Outline trusts that header (app.proxy is on unless PROXY_HEADERS_TRUSTED is
# disabled) to decide whether to issue the host-bound __Host- CSRF cookie.
# Fall back to $scheme when the header is absent, e.g. when the app is reached
# directly on its host port instead of through Traefik.
map $http_x_forwarded_proto $outline_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen        80;
  client_max_body_size 100m;

  # Outline Wiki
  location / {
    proxy_pass http://outline:3000;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # $http_host, not $host: nginx applied the last of the two Host directives
    # this file used to carry, so this preserves the port when the app is
    # reached directly on its host port rather than through Traefik.
    proxy_set_header Host $http_host;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $outline_forwarded_proto;
    proxy_set_header X-Forwarded-Proto $outline_forwarded_proto;
    proxy_redirect off;
  }

  # Static files for the OIDC provider
  location /uc/static {
    alias /uc/static_root;
  }

  # OIDC provider
  location /uc {
    proxy_set_header SCRIPT_NAME /uc;
    proxy_pass http://outline-oidc:8000;
  }
}
